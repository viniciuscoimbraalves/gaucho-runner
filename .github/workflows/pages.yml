name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # O jogo é estático: publica apenas a pasta gaucho-runner/,
      # sem o index.html de redirecionamento nem os JPGs de referência.
      - name: Preparar site
        run: |
          mkdir -p _site
          cp -r gaucho-runner/. _site/
          rm -f _site/*.jpg

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
